## SteelSeries Arctis 7: prefer the "Game" output over "Chat".
## Chat ships with the higher priority, so WirePlumber falls back to it whenever
## it picks a default on its own. Raising Game above it keeps Chat selectable.
## The nicknames replace "USB Audio" / "USB Audio #1" in Omarchy's audio panel.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.usb-SteelSeries_SteelSeries_Arctis_7-.*.stereo-game"
      }
    ]
    actions = {
      update-props = {
        node.nick = "Arctis 7 Game"
        priority.session = 1200
        priority.driver = 1200
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.usb-SteelSeries_SteelSeries_Arctis_7-.*.mono-chat"
      }
    ]
    actions = {
      update-props = {
        node.nick = "Arctis 7 Chat"
      }
    }
  }
]
